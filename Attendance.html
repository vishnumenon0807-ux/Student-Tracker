<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Calculator</title>

<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    padding:30px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    color:#6c3df4;
    margin-bottom:30px;
}

/* Cards */

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,0.1);
    margin-bottom:30px;
}

.card h2{
    color:#6c3df4;
    margin-bottom:20px;
}

/* Labels */

label{
    display:block;
    margin-bottom:8px;
    margin-top:15px;
    font-weight:bold;
    color:#333;
}

/* Inputs */

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    outline:none;
    transition:0.3s;
}

input:focus,
select:focus{

    border-color:#6c3df4;
    box-shadow:0 0 8px rgba(108,61,244,.25);

}

/* Buttons */

button{

    margin-top:20px;
    padding:13px;
    width:100%;
    border:none;
    border-radius:8px;
    background:#6c3df4;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;

}

button:hover{

    background:#5630d8;

}

/* Table */

table{

    width:100%;
    border-collapse:collapse;
    margin-top:20px;

}

th{

    background:#6c3df4;
    color:white;
    padding:14px;

}

td{

    padding:14px;
    text-align:center;
    border-bottom:1px solid #ddd;

}

tbody tr:nth-child(even){

    background:#fafafa;

}

tbody tr:hover{

    background:#f2efff;

}

/* Inputs inside table */

td input{

    width:100%;
    padding:8px;
    text-align:center;

}

/* Attendance Result */

.good{

    color:#2e7d32;
    font-weight:bold;

}

.bad{

    color:#d32f2f;
    font-weight:bold;

}

/* Predictor */

#prediction{

    margin-top:20px;
    padding:18px;
    border-radius:10px;
    background:#f7f5ff;
    border-left:5px solid #6c3df4;
    font-size:18px;
    font-weight:bold;

}

/* Responsive */

@media(max-width:900px){

table{

    display:block;
    overflow-x:auto;

}

body{

    padding:15px;

}

.card{

    padding:18px;

}

}

@media(max-width:600px){

h1{

    font-size:28px;

}

.card h2{

    font-size:22px;

}

button{

    font-size:15px;

}

}
.navbar{
    background:#6c3df4;
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:white;
    font-size:32px;
    font-weight:bold;
}

.nav-links{
    display:flex;
    gap:30px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-size:18px;
    font-weight:500;
}
</style>

</head>
<body>

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Calculator</title>

<link rel="stylesheet" href="attendance.css">

</head>

<body>
<nav class="navbar">

    <div class="logo">
        Student Tracker
    </div>

    <div class="nav-links">

        <a href="/homepage">Dashboard</a>
        <a href="/grades">Grades</a>
        <a href="/timetable">Timetable</a>
        <a href="/assignment">Assignment</a>
        <a href="/attendance">Attendance</a>

    </div>

</nav>
<div class="container">

<h1>Attendance Calculator</h1>

<!-- STEP 1 -->

<div class="card">

    <h2>Step 1 : Create Subjects</h2>

    <label>Number of Subjects</label>

    <input
        type="number"
        id="subjectCount"
        min="1"
        max="15"
        placeholder="Enter Number of Subjects">

    <button onclick="generateTable()">
        Generate Subjects
    </button>

</div>

<!-- STEP 2 -->

<div
class="card"
id="tableCard"
style="display:none;">

<h2>Step 2 : Enter Attendance</h2>

<table id="attendanceTable">

<thead>

<tr>

<th>Subject Name</th>
<th>Classes Attended</th>
<th>Total Classes</th>
<th>Attendance</th>
<th>Status</th>

</tr>

</thead>

<tbody id="tableBody">

<!-- Generated by JavaScript -->

</tbody>

</table>

<button onclick="calculateAttendance()">

Calculate Attendance

</button>

</div>

<!-- STEP 3 -->

<div
class="card"
id="predictorCard"
style="display:none;">

<h2>Attendance Predictor</h2>

<label>Select Subject</label>

<select id="subjectSelect">

<option value="">Select Subject</option>

</select>

<label>Remaining Classes</label>

<input
type="number"
id="remainingClasses"
placeholder="Enter Remaining Classes"
min="0">

<button onclick="calculateBunk()">

Calculate

</button>

<div id="prediction">

Prediction will appear here.

</div>

</div>

</div>

<script src="attendance.js"></script>

</body>
</html>

<script>
    function generateTable() {

    const count = parseInt(document.getElementById("subjectCount").value);

    if (isNaN(count) || count <= 0) {
        alert("Enter a valid number of subjects.");
        return;
    }

    const tableBody = document.getElementById("tableBody");
    const subjectSelect = document.getElementById("subjectSelect");

    tableBody.innerHTML = "";
    subjectSelect.innerHTML = '<option value="">Select Subject</option>';

    for (let i = 1; i <= count; i++) {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>
                <input
                    type="text"
                    class="subject"
                    placeholder="Subject ${i}"
                    oninput="updateSubjects()">
            </td>

            <td>
                <input
                    type="number"
                    class="attended"
                    min="0">
            </td>

            <td>
                <input
                    type="number"
                    class="total"
                    min="0">
            </td>

            <td class="percentage">-</td>

            <td class="status">-</td>
        `;

        tableBody.appendChild(row);

    }

    document.getElementById("tableCard").style.display = "block";
    document.getElementById("predictorCard").style.display = "block";
}

function updateSubjects() {

    const subjectSelect = document.getElementById("subjectSelect");
    subjectSelect.innerHTML = '<option value="">Select Subject</option>';

    const subjects = document.querySelectorAll(".subject");

    subjects.forEach((subject, index) => {

        if (subject.value.trim() !== "") {

            const option = document.createElement("option");

            option.value = index;
            option.textContent = subject.value;

            subjectSelect.appendChild(option);

        }

    });

}

function calculateAttendance() {

    const rows = document.querySelectorAll("#tableBody tr");

    rows.forEach(row => {

        const attended = parseInt(row.querySelector(".attended").value);
        const total = parseInt(row.querySelector(".total").value);

        const percentageCell = row.querySelector(".percentage");
        const statusCell = row.querySelector(".status");

        if (isNaN(attended) || isNaN(total) || total <= 0 || attended > total) {

            percentageCell.innerHTML = "-";
            statusCell.innerHTML = "Invalid Data";
            statusCell.className = "status bad";

            return;

        }

        const percentage = (attended / total) * 100;

        percentageCell.innerHTML = percentage.toFixed(2) + "%";

        if (percentage >= 75) {

            percentageCell.className = "percentage good";
            statusCell.className = "status good";
            statusCell.innerHTML = "Good";

        }

        else {

            let need = 0;

            while (((attended + need) / (total + need)) * 100 < 75) {

                need++;

            }

            percentageCell.className = "percentage bad";
            statusCell.className = "status bad";
            statusCell.innerHTML = "Attend " + need + " class(es)";

        }

    });

}

function calculateBunk() {

    const selected = document.getElementById("subjectSelect").value;
    const remaining = parseInt(document.getElementById("remainingClasses").value);

    if (selected === "") {

        alert("Select a subject.");
        return;

    }

    if (isNaN(remaining) || remaining < 0) {

        alert("Enter valid remaining classes.");
        return;

    }

    const row = document.querySelectorAll("#tableBody tr")[selected];

    const attended = parseInt(row.querySelector(".attended").value);
    const total = parseInt(row.querySelector(".total").value);

    if (isNaN(attended) || isNaN(total)) {

        alert("Enter attendance details first.");
        return;

    }

    const futureTotal = total + remaining;

    let maxBunks = 0;

    for (let bunk = 0; bunk <= remaining; bunk++) {

        const attendFuture = remaining - bunk;

        const finalAttendance =
            ((attended + attendFuture) / futureTotal) * 100;

        if (finalAttendance >= 75) {

            maxBunks = bunk;

        }

    }

    const prediction = document.getElementById("prediction");

    if (maxBunks === 0) {

        prediction.innerHTML =
            "<span class='bad'>You must attend all remaining classes to maintain 75% attendance.</span>";

    }

    else {

        prediction.innerHTML =
            "<span class='good'>You can leave <b>" +
            maxBunks +
            "</b> class(es) and still maintain 75% attendance.</span>";

    }

}
</script>

</body>
</html>
